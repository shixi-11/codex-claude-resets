name: Refresh announcements for Vercel
on:
  push:
    branches: [main]
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
    - cron: '23 2 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: codex-respawn-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test
      - name: Check public announcements
        run: node scripts/collect.mjs
      - name: Check official Claude promotion terms
        if: github.event_name != 'push'
        run: node scripts/collect-platforms.mjs
      - name: Daily source digest
        if: github.event.schedule == '23 2 * * *' || github.event_name == 'workflow_dispatch'
        run: node scripts/digest.mjs
      - name: Cache translations for new source records
        run: node scripts/translate.mjs
        env:
          TRANSLATION_REQUEST_LIMIT: '80'
      - name: Validate collected records and classification synchronization
        run: node --test
      - run: node scripts/build.mjs
      - name: Verify static pages before publishing
        run: node --test test/static-deployment.test.mjs
      - name: Audit tracking and prepare review queue
        id: tracking
        run: node scripts/audit-tracking.mjs
      - name: Save source records for Vercel automatic deployment
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data digests monitoring
          if ! git diff --cached --quiet; then
            git commit -m "Refresh verified announcements and source health"
            git push
          fi
      - name: Publish verified static output for Vercel
        run: node scripts/publish-static.mjs
      - name: Retain backend tracking evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tracking-audit
          path: output/tracking-audit.json
          if-no-files-found: warn
          retention-days: 14
      - name: Alert on newly detected tracking problems
        if: steps.tracking.outputs.new_alerts != '' && steps.tracking.outputs.new_alerts != '0'
        run: |
          echo '::error::New reset tracking issues require review. See the job summary and tracking-audit artifact.'
          exit 1
